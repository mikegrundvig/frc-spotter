// The container harness: a library for container tests of the agent and its packs (src/main: a
// coprocessor in a container under systemd, its images, the tests' network, Toxiproxy), which a
// pack's own tests use too, and Spotter's own container tests (src/test, @ContainerTest, tagged
// "container"): the agent installed from its .deb in a plain Debian 13 container under systemd, with
// no Java of its own, its root read-only and /data writable as on a board; the -all.jar on a stock
// Java 17. The tests play the robot with a minimal test client of protocol 2 (the robot's manager is
// coming). They need Docker or Podman running Linux containers, and skip themselves without (as on a
// Windows laptop); in CI on Linux they must run. `test -Pquick` leaves them out unless --tests names
// them.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    // The agent's -all.jar with its files (unit, rules, install script), which one test installs on
    // a stock Java 17.
    agentJar {
        canBeConsumed = false
        canBeResolved = true
    }
    // The agent's package as installed (with DEBIAN/), which the tests build into a .deb and install.
    agentPackage {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    agentJar project(path: ":agent", configuration: "agentJarRelease")
    agentPackage project(path: ":agent", configuration: "agentPackage")

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    api project(":protocol")
    api platform(libs.testcontainers.bom)
    api libs.testcontainers.core
    api libs.testcontainers.toxiproxy
    api platform(libs.junit.bom)
    api "org.junit.jupiter:junit-jupiter-api"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
}

tasks.named("test") {
    useJUnitPlatform()
    def agentJar = configurations.agentJar
    def agentPackage = configurations.agentPackage
    inputs.files(agentJar).withPropertyName("agentJar").withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(agentPackage).withPropertyName("agentPackage").withPathSensitivity(PathSensitivity.RELATIVE)
    doFirst {
        systemProperty "spotter.agentJar", agentJar.singleFile.absolutePath
        systemProperty "spotter.agentPackage", agentPackage.singleFile.absolutePath
    }
    // In CI on Linux, Docker is there: a container test that can't run fails rather than skips.
    def os = System.getProperty("os.name").toLowerCase()
    systemProperty "spotter.requireContainers", (System.getenv("CI") != null && os.contains("linux")).toString()
    // Rootless Podman, as on a developer's Linux machine: its user socket, when it's there and
    // nothing else was asked for. Testcontainers' cleanup container (Ryuk) needs a root socket, so the
    // tests stop their own containers (and remove what a crashed run left, by label).
    def runtimeDir = System.getenv("XDG_RUNTIME_DIR")
    def podman = runtimeDir == null ? null : new File(runtimeDir, "podman/podman.sock")
    if (System.getenv("DOCKER_HOST") == null && podman != null && podman.exists()) {
        environment "DOCKER_HOST", "unix://" + podman.absolutePath
        environment "TESTCONTAINERS_RYUK_DISABLED", "true"
    }
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
apply from: rootProject.file("gradle/quality.gradle")

// Images build within minutes: no test may hang past ten (quality.gradle's
// two minutes are for unit tests).
tasks.named("test") {
    systemProperty "junit.jupiter.execution.timeout.default", "10 m"
}
