# The container tests' stand-in for the software a coprocessor runs: a web server on 5800, as a
# vision program's page is, watched as a real pack would watch it.
pack: standin
journalUnits: [vision.service]
probes:
  - id: vision.unit
    kind: unit
    unit: vision.service
    every: 2
  - id: vision.http
    kind: http
    url: http://localhost:5800/api/status.json
    field: status
    equals: up
    every: 2
