# The container tests' stand-in for the software a coprocessor runs (a web server on 5800, as a
# vision program's page is), watched by every kind of collector.
pack: standin
version: 1.0.0
collectors:
  - id: service
    run: [systemctl, is-active, vision.service]
    every: 1s
    fields:
      running: {label: Stand-in's service, type: text, fail: {notEquals: active}}
  - id: broken
    run: [systemctl, is-active, broken.service]
    every: 1s
    fields:
      state: {type: text}
      exit: {type: number, fail: {notEquals: 0}}
  - id: web
    http: {get: "http://localhost:5800/api/status.json"}
    every: 1s
    fields:
      outcome: {type: text}
      status: {label: Stand-in answers, type: number, fail: {notEquals: 200, missing: true}}
      state: {type: text}
  - id: uptime
    file: /proc/uptime
    every: 1s
    fields:
      seconds: {label: Up for, type: number, unit: s}
  - id: answer
    run: [./answer]
    every: 1s
    fields:
      answer: {type: number}
      mood: {type: status}
  - id: user
    run: [id, -un]
    every: 1s
    fields:
      name: {type: text}
  - id: slow
    run: [sleep, "30"]
    every: 2s
    timeout: 1s
    fields:
      text: {type: text}
  - id: gone
    file: /sys/bus/usb/devices/7-1/product
    every: 1s
    fields:
      product: {type: text, fail: {missing: true}}
  - id: ticker
    run: [date, +%s]
    every: 250ms
    fields:
      second: {label: The board's clock, type: number, unit: s}
logs:
  - id: log
    label: Stand-in's log
    run: [./pager]
actions:
  - id: hello
    label: Say hello
    run: [./hello]
    input: text
    response:
      exit: {type: number, fail: {notEquals: 0}}
      greeting: {type: text}
  - id: fail
    run: [sh, -c, "echo failing >&2; exit 3"]
    response:
      exit: {type: number, fail: {notEquals: 0}}
  - id: wait
    label: Wait, until stopped
    run: [./wait]
    timeout: 10m
  - id: hurry
    label: Wait, but not long
    run: [./wait]
    timeout: 2s
  - id: big
    run: [head, -c, "3000000", /dev/zero]
  - id: page
    http: {get: "http://localhost:5800/api/status.json"}
    response:
      status: {type: number, fail: {notEquals: 200}}
      state: {type: text}
