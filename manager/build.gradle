// The robot program's manager: the library that keeps each coprocessor agent's stream open on threads
// of its own, judges each value against its limits, and gives robot code a snapshot to read each loop,
// alerts as data, and a hook to log what it received. Plain Java 17 with nothing but QuickBuffers'
// runtime, which WPILib already ships: no WPILib or AdvantageKit, so robot code wires in what's
// robot-specific (whether it's enabled, the field, its clock, its alerts and logs).
//
// It also holds the protocol both sides speak, version 2 (package ...spotter.protocol): spotter.proto,
// whose classes QuickBuffers generates at build time, so nothing reads or writes a message by hand;
// and the code the agent shares with it (the pack hash, signing, the wire checks, the constants). The
// agent depends on this project for it.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
    id "com.google.protobuf"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, as the agent's: see agent/build.gradle.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.quickbuf.runtime
    api libs.jspecify

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
    // Reads spotter.proto's descriptor (QuickBuffers carries its bytes), to check WireCheck's table.
    testImplementation libs.protobuf.java
}

// The real agent for the tests (LocalAgent): Spotter's agent program, built by cargo with its test
// feature, which the tests run as a process of its own on a local port, with packs they write.
def agentCrate = rootProject.file("agent")
def agentBinary = new File(agentCrate, "target/debug/frc-spotter")
def agentForTests = tasks.register("agentForTests", Exec) {
    description = "Build the agent program with its test feature (cargo), for the tests."
    workingDir agentCrate
    commandLine "cargo", "build", "--locked", "-j", "4", "--features", "fixture"
    inputs.files(fileTree(agentCrate) {
        include "Cargo.toml", "Cargo.lock", "build.rs", "src/**"
    })
    .withPropertyName("crate").withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(file("src/main/proto/spotter.proto")).withPropertyName("proto")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(agentBinary)
}

// QuickBuffers in place of protobuf-java, as WPILib generates its own: protoc runs
// QuickBuffers' generator, with descriptors, which WPILib's protobuf logging needs.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protoc.get()}"
    }
    plugins {
        quickbuf {
            artifact = "us.hebi.quickbuf:protoc-gen-quickbuf:${libs.versions.quickbuf.generator.get()}"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                remove java
            }
            task.plugins {
                quickbuf {
                    option "gen_descriptors=true"
                }
            }
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()
    dependsOn agentForTests
    inputs.file(agentBinary).withPropertyName("agentBinary").withPathSensitivity(PathSensitivity.NONE)
    systemProperty "spotter.agentBinary", agentBinary.absolutePath
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
// The generated messages are QuickBuffers', not ours to cover.
ext.coverageExcludes = [
    "**/protocol/Spotter.class",
    "**/protocol/Spotter\$*"
]
apply from: rootProject.file("gradle/quality.gradle")

// QuickBuffers' javadoc names parameters its methods don't have.
ext.doclint = "all,-missing,-reference"
// Published as com.michaelgrundvig.frc:spotter-manager (gradle/publishing.gradle).
ext.mavenDescription = "Spotter's manager, for an FRC robot program: each coprocessor agent's stream kept open off the robot loop, its values judged against their limits, alerts as data, a snapshot to read each loop; and Spotter's protocol, version 2 (spotter.proto, generated by QuickBuffers)."
apply from: rootProject.file("gradle/publishing.gradle")
