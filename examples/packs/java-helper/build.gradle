// An example pack with a Java helper (docs/agent.md, "Packs"): its definitions (pack.yaml) and the
// helper they name, which runs on the Java the agent runs on (FRC_AGENT_JAVA), so it's Java 17 too.
// The container tests install it beside the -all.jar on a stock Java 17; a copy is the start of a
// pack of your own.
//
//   ./gradlew :java-helper-pack:packFolder    the pack as installed: build/pack/java-helper/

plugins {
    id "java"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, as the agent's: see agent/build.gradle.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

configurations {
    // The build tool, which checks pack.yaml and writes pack.json.
    packTool {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    packTool project(":api")

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
}

tasks.named("test") {
    useJUnitPlatform()
}

// java-helper.jar: the helper, run with `java -jar`.
tasks.named("jar") {
    archiveFileName = "java-helper.jar"
    manifest {
        attributes("Main-Class": "com.michaelgrundvig.frc.spotter.examples.javahelper.JavaHelper")
    }
}

// The pack's definitions, checked and written as the agent reads them (pack.json).
def packJson = tasks.register("packJson", JavaExec) {
    description = "Check pack.yaml and write it as pack.json."
    classpath = configurations.packTool
    mainClass = "com.michaelgrundvig.frc.spotter.tools.CoprocessorBuild"
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    def source = file("pack.yaml")
    def out = layout.buildDirectory.file("pack-json/pack.json")
    inputs.file(source)
    outputs.file(out)
    args "pack", source.absolutePath, out.get().asFile.absolutePath
}

// The pack as installed (/usr/lib/frc-coprocessor/packs/java-helper/), with its install script.
def packFolderTask = tasks.register("packFolder", Sync) {
    group = "build"
    description = "Assemble the example pack as installed, in build/pack/java-helper."
    into layout.buildDirectory.dir("pack/java-helper")
    from(packJson)
    from(tasks.named("jar")) { into "lib" }
    // The launcher's source folder isn't named bin/, which Git ignores (an IDE's output).
    from("package/launcher") {
        into "bin"
        filePermissions { unix("0755") }
    }
    from("package/install.sh") {
        filePermissions { unix("0755") }
    }
}

configurations {
    // The pack as installed, for the container tests.
    packFolder {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    add("packFolder", packFolderTask.map { it.destinationDir }) { builtBy packFolderTask }
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
apply from: rootProject.file("gradle/quality.gradle")
