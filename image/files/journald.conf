# The journal, kept on /data (bind-mounted at /var/log/journal), written within 10 s of each
# message: by default journald syncs only every 5 minutes (except CRIT and above), so a power cut
# would lose the minutes that matter. Overrides PhotonVision's 100 MB cap.
[Journal]
Storage=persistent
SystemMaxUse=256M
SyncIntervalSec=10s
