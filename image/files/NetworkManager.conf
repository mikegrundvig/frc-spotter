# The robot network is configured by the image (robot.nmconnection, written at stamping), never at
# run time: PhotonVision runs with -n, so it leaves the network alone.
[main]
# No DNS on a robot network, and the root is read-only: leave /etc/resolv.conf as it is.
dns=none
rc-manager=unmanaged
# No automatic DHCP profile ("Wired connection 1") beside the robot's static address.
no-auto-default=*
