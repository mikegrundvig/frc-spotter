# cargo deny check: the crates the agent is built from, against advisories, an allowed set of
# licences, and crates.io as the only source. CI runs it on every push (.github/workflows/ci.yml).

[graph]
# The coprocessors' architectures, and the machines CI builds on.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[licenses]
# Spotter's own, MIT, and every licence of a crate it's built from, each compatible with it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Old and new versions of a few build-time crates side by side: said, and allowed.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
