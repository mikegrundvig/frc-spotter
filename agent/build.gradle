// The coprocessor agent: a small web service each coprocessor runs, speaking protocol 2 to the robot's
// manager (docs/agent.md). It's a runner: it runs what its packs declare (collectors, logs,
// actions) and measures nothing itself. One runnable jar, frc-spotter.jar, with the manager (and the
// protocol in it), QuickBuffers' runtime, avaje-jsonb and snakeyaml-engine inside, Java 17 bytecode.
// The same jar is Spotter's command line (docs/tools.md):
//
//   java -jar frc-spotter.jar [serve] ...            the agent (the package's launcher runs it)
//   java -jar frc-spotter.jar check <folder>...      packs, read as the agent reads them
//   java -jar frc-spotter.jar status <board>         a board's problems, values, identity, packs
//
// Its container tests (src/containerTest, ./gradlew containerTest) install its .deb in a plain
// Debian 13 container under systemd, and run the manager against it, end to end.

plugins {
    id "java"
    // LocalAgent: a real agent in a test's own process, for the manager's tests.
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, though built with 25: the agent's jar also runs on a board's own
// Java, which may be 17, and the robot program, on 25, runs
// 17's unchanged. So nothing past 17: no pattern-matching switches, sequenced collections, or
// virtual threads.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    // The protocol (spotter.proto's messages, the pack hash, signing), and the manager, which the
    // command line's status reads a board with.
    implementation project(":spotter-manager")
    // Only its mapper (avaje-json-core's) is used; its avaje-inject plugin isn't.
    implementation(libs.avaje.jsonb) {
        exclude group: "io.avaje", module: "avaje-jsonb-inject-plugin"
    }
    implementation libs.snakeyaml.engine

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
    // The catalog's packs (packs/), which CatalogTest installs as a board's installer would.
    def catalog = rootProject.file("packs")
    inputs.files(fileTree(catalog) { exclude "**/build/**" })
    .withPropertyName("catalog").withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty "spotter.catalog", catalog.absolutePath
}

// frc-spotter.jar: the agent with everything it needs (the shared code), run with
// `java -jar` on Java 17 or newer.
tasks.named("jar") {
    archiveFileName = "frc-spotter.jar"
    manifest {
        attributes("Main-Class": "com.michaelgrundvig.frc.spotter.agent.AgentMain",
        "Implementation-Version": project.version)
    }
    dependsOn configurations.runtimeClasspath
    // Spotter's license and what the jar holds that isn't Spotter's (THIRD-PARTY.md).
    from(rootProject.files("LICENSE", "THIRD-PARTY.md")) { into "META-INF/frc-spotter" }
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA",
                "module-info.class", "META-INF/versions/*/module-info.class"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
apply from: rootProject.file("gradle/quality.gradle")

// ---- The agent's package (docs/agent.md, "The agent's package") ----
//
//   ./gradlew :spotter-agent:agentPackage   the package's files as installed: build/package/root
//   ./gradlew :spotter-agent:agentRelease   build/distributions: the .deb (where dpkg-deb is), the
//                                   tarball, and the -all.jar with its files
//
// One set of files three ways: a .deb with its own Java runtime, a tarball of the same for systems
// without dpkg, and the -all.jar alone, with its unit, polkit rules, and install script beside it,
// for a board that already has Java 17 or newer. The runtime is jlink's, of the modules the agent
// needs, for the computer building it: build an ARM package on ARM. No pack is installed: packs are
// folders an installer puts in /etc/frc-spotter/packs/, or the robot pushes.
def agentVersion = (project.findProperty("agentVersion") ?: "0.1.0").toString()
def debianArch = [amd64: "amd64", x86_64: "amd64", aarch64: "arm64", arm64: "arm64"]
.get(System.getProperty("os.arch"), System.getProperty("os.arch"))
// The runtime's modules: the agent's, and no more (jdeps --print-module-deps on its jar). QuickBuffers
// reads and writes through sun.misc.Unsafe, which is jdk.unsupported's.
def runtimeModules = "java.base,jdk.httpserver,jdk.unsupported"
def packageRoot = layout.buildDirectory.dir("package/root")

def agentRuntime = tasks.register("agentRuntime", Exec) {
    description = "Link the agent's own Java runtime (jlink), for the computer building it."
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    def out = layout.buildDirectory.dir("package/runtime")
    inputs.property("modules", runtimeModules)
    outputs.dir(out)
    doFirst { delete out }
    executable launcher.map { it.metadata.installationPath.file("bin/jlink").asFile.absolutePath }.get()
    // --strip-java-debug-attributes, not --strip-debug: that one runs objcopy, which a laptop may
    // not have; the runtime's native libraries come stripped.
    args "--add-modules", runtimeModules, "--strip-java-debug-attributes", "--no-header-files", "--no-man-pages",
            "--compress=zip-9", "--output", out.get().asFile.absolutePath
}

def agentPackageTask = tasks.register("agentPackage", Sync) {
    group = "build"
    description = "Assemble the agent's package as installed, with DEBIAN/: build/package/root."
    into packageRoot
    from(tasks.named("jar")) { into "usr/lib/frc-spotter" }
    from(agentRuntime) { into "usr/lib/frc-spotter/runtime" }
    // The launcher's source folder isn't named bin/, which Git ignores (an IDE's output).
    from("package/launcher") {
        into "usr/lib/frc-spotter/bin"
        filePermissions { unix("0755") }
    }
    from("package") {
        include "*.service"
        into "usr/lib/systemd/system"
    }
    from("package/frc-spotter.sysusers") {
        into "usr/lib/sysusers.d"
        rename { "frc-spotter.conf" }
    }
    from("package/frc-spotter.tmpfiles") {
        into "usr/lib/tmpfiles.d"
        rename { "frc-spotter.conf" }
    }
    from("package") {
        include "*.rules"
        into "usr/share/polkit-1/rules.d"
    }
    from("package/debian") {
        include "postinst", "prerm", "postrm"
        into "DEBIAN"
        filePermissions { unix("0755") }
    }
    from("package/debian/control.in") {
        into "DEBIAN"
        rename { "control" }
        // Installed-Size is in KiB; the runtime is most of it.
        filter { line -> line.replace("@VERSION@", agentVersion).replace("@ARCH@", debianArch) }
    }
    inputs.property("version", agentVersion)
    // jlink's legal notices are read-only, which Sync can't write over: start afresh.
    doFirst {
        def root = packageRoot.get().asFile
        if (root.exists()) {
            ant.chmod(dir: root, perm: "u+w", includes: "**/*")
            delete root
        }
    }
    doLast {
        def size = fileTree(packageRoot.get().asFile) { exclude "DEBIAN/**" }.files.sum(0L) { it.length() }
        def control = new File(packageRoot.get().asFile, "DEBIAN/control")
        control.text = control.text.replace("@SIZE@", Long.toString((long) Math.ceil(size / 1024.0)))
    }
}

def distributions = layout.buildDirectory.dir("distributions")

def agentDeb = tasks.register("agentDeb", Exec) {
    description = "Build the agent's .deb with dpkg-deb, where it's installed (Debian, Ubuntu, CI)."
    dependsOn agentPackageTask
    def deb = distributions.map { it.file("frc-spotter_${agentVersion}_${debianArch}.deb") }
    outputs.file(deb)
    def dpkgDeb = [
        "/usr/bin/dpkg-deb",
        "/bin/dpkg-deb"
    ].find { new File(it).canExecute() }
    onlyIf("dpkg-deb is installed") { dpkgDeb != null }
    doFirst { distributions.get().asFile.mkdirs() }
    executable dpkgDeb ?: "dpkg-deb"
    args "--root-owner-group", "-Zxz", "--build", packageRoot.get().asFile.absolutePath,
            deb.get().asFile.absolutePath
}

def agentTarball = tasks.register("agentTarball", Tar) {
    description = "Pack the agent and its runtime for systems without dpkg, with its install script."
    archiveFileName = "frc-spotter-${agentVersion}-linux-${debianArch}.tar.gz"
    destinationDirectory = distributions
    compression = Compression.GZIP
    into("frc-spotter-${agentVersion}")
    from(agentPackageTask) { exclude "DEBIAN/**" }
    from("package/install.sh") {
        filePermissions {
            unix("0755")
        }
    }
}

def agentJarReleaseTask = tasks.register("agentJarRelease", Sync) {
    description = "The -all.jar, for a board with Java 17 or newer, with its unit, rules, and install script beside it."
    into distributions.map { it.dir("jar") }
    // The jar's name holds the version, which the rename below hides from Gradle's up-to-date check.
    inputs.property("version", agentVersion)
    from(tasks.named("jar")) {
        rename {
            "frc-spotter-${agentVersion}-all.jar"
        }
    }
    from("package/launcher") {
        include "frc-spotter"
        filePermissions {
            unix("0755")
        }
    }
    from("package/install.sh") {
        filePermissions {
            unix("0755")
        }
    }
    from("package") { include "*.rules", "*.service", "*.sysusers", "*.tmpfiles" }
}

// The -all.jar with its files, as one download: unpack it and run its install.sh.
def agentJarTarball = tasks.register("agentJarTarball", Tar) {
    description = "Pack the -all.jar with its unit, rules, and install script, for a release."
    archiveFileName = "frc-spotter-${agentVersion}-all.tar.gz"
    destinationDirectory = distributions
    compression = Compression.GZIP
    into("frc-spotter-${agentVersion}-all")
    from(agentJarReleaseTask)
}

tasks.register("agentRelease") {
    group = "build"
    description = "Build the agent's artifacts in build/distributions: the .deb, the tarball, the -all.jar alone and with its files."
    dependsOn agentDeb, agentTarball, agentJarReleaseTask, agentJarTarball
}

// ---- The container tests (src/containerTest) ----
//
//   ./gradlew :spotter-agent:containerTest
//
// The agent installed from its .deb in a plain Debian 13 container under systemd, with no Java of
// its own, its root read-only and /data writable as on a board; the -all.jar on a stock Java 17. The
// tests play the robot with a minimal test client of protocol 2, and with the robot's manager itself,
// end to end. They need Docker or Podman running Linux containers, and skip themselves without (as
// on a Windows laptop); in CI on Linux they must run. Part of check and ci; -Pquick leaves them out
// unless --tests names them.
sourceSets {
    containerTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    containerTestImplementation.extendsFrom implementation
    containerTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    containerTestImplementation platform(libs.testcontainers.bom)
    containerTestImplementation libs.testcontainers.core
    containerTestImplementation platform(libs.junit.bom)
    containerTestImplementation "org.junit.jupiter:junit-jupiter"
    containerTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
    containerTestImplementation libs.assertj.core
}

def containerTests = tasks.register("containerTest", Test) {
    group = "verification"
    description = "Run the container tests: the agent's .deb under systemd, the manager against it."
    testClassesDirs = sourceSets.containerTest.output.classesDirs
    classpath = sourceSets.containerTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter "test"
    maxHeapSize = "1536m"
    // Images build within minutes: no test may hang past ten.
    systemProperty "junit.jupiter.execution.timeout.default", "10 m"
    def quick = project.hasProperty("quick")
    def testsNamed = gradle.startParameter.taskRequests.any { it.args.contains("--tests") }
    onlyIf("not -Pquick, unless --tests names them") { !quick || testsNamed }
    // What they install: the package as installed (built into a .deb), and the -all.jar with its files.
    def installed = agentPackageTask.map { it.destinationDir }
    def jarRelease = agentJarReleaseTask.map { it.destinationDir }
    inputs.files(agentPackageTask).withPropertyName("agentPackage").withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(agentJarReleaseTask).withPropertyName("agentJar").withPathSensitivity(PathSensitivity.RELATIVE)
    // The catalog's packs (packs/), which CatalogContainerTest installs.
    def catalog = rootProject.file("packs")
    inputs.files(fileTree(catalog) { exclude "**/build/**" })
    .withPropertyName("catalog").withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty "spotter.catalog", catalog.absolutePath
    doFirst {
        systemProperty "spotter.agentJar", jarRelease.get().absolutePath
        systemProperty "spotter.agentPackage", installed.get().absolutePath
    }
    // In CI on Linux, Docker is there: a container test that can't run fails rather than skips.
    def os = System.getProperty("os.name").toLowerCase()
    systemProperty "spotter.requireContainers", (System.getenv("CI") != null && os.contains("linux")).toString()
    // Rootless Podman, as on a developer's Linux machine: its user socket, when it's there and
    // nothing else was asked for. Testcontainers' cleanup container (Ryuk) needs a root socket, so the
    // tests stop their own containers (and remove what a crashed run left, by label).
    def runtimeDir = System.getenv("XDG_RUNTIME_DIR")
    def podman = runtimeDir == null ? null : new File(runtimeDir, "podman/podman.sock")
    if (System.getenv("DOCKER_HOST") == null && podman != null && podman.exists()) {
        environment "DOCKER_HOST", "unix://" + podman.absolutePath
        environment "TESTCONTAINERS_RYUK_DISABLED", "true"
    }
    // They run the agent in containers, not in this process: nothing here for coverage to count.
    jacoco {
        enabled = false
    }
}
tasks.named("check") {
    dependsOn containerTests
}

// Published as com.michaelgrundvig.frc:spotter-agent (gradle/publishing.gradle): its jar the runnable
// frc-spotter.jar, with everything inside and no dependencies of its own, so a robot program's build
// runs its check and status (a JavaExec) with nothing else.
ext.mavenDescription = "Spotter's agent, for an FRC robot's coprocessors, and Spotter's command line: check a folder of packs as the agent reads them, and read a board's status. Runnable: java -jar."
ext.mavenJar = tasks.named("jar")
apply from: rootProject.file("gradle/publishing.gradle")
