# Every build and test version in one place.

[versions]
spotless = "8.6.0"
errorprone-plugin = "5.2.0"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
# The protocol (spotter.proto), generated by QuickBuffers: the runtime WPILib 2027 uses (GradleRIO
# 2027.0.0-alpha-7's), and a protoc and generator that build for it.
protobuf-plugin = "0.9.5"
protoc = "3.21.12"
quickbuf-generator = "1.3.3"
quickbuf = "1.4"
# Tests only: reads spotter.proto's own descriptor, to check WireCheck's table against it.
protobuf-java = "4.36.2"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
quickbuf-runtime = { module = "us.hebi.quickbuf:quickbuf-runtime", version.ref = "quickbuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-java" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
