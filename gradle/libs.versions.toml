# Every build and test version in one place.

[versions]
spotless = "8.6.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
testcontainers = "2.0.5"
# The protocol (spotter.proto), generated by QuickBuffers: the versions WPILib 2027 uses (GradleRIO
# 2027.0.0-alpha-7's runtime, and PhotonVision's protoc and generator).
protobuf-plugin = "0.9.5"
protoc = "3.21.12"
quickbuf-generator = "1.3.3"
quickbuf = "1.4"
# A collector's or an action's JSON output: WPILib 2027's JSON library, at GradleRIO
# 2027.0.0-alpha-7's version.
avaje-jsonb = "3.14"
# Packs (YAML 1.2, safe by default).
snakeyaml-engine = "3.1.1"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
# The container tests: the agent in a container, with Toxiproxy between it and the robot.
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy" }
quickbuf-runtime = { module = "us.hebi.quickbuf:quickbuf-runtime", version.ref = "quickbuf" }
avaje-jsonb = { module = "io.avaje:avaje-jsonb", version.ref = "avaje-jsonb" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
