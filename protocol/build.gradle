// The protocol the agent and the robot's manager speak, version 2: spotter.proto, whose classes
// QuickBuffers generates at build time, so nothing reads or writes a message by hand; and the code
// both sides share (the pack hash, the protocol's constants). Java 17, with nothing but
// QuickBuffers' runtime, which WPILib already ships on the robot.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
    id "com.google.protobuf"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, as the agent's: see agent/build.gradle.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.quickbuf.runtime
    api libs.jspecify

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    // Reads spotter.proto's descriptor (QuickBuffers carries its bytes), to check WireCheck's table.
    testImplementation libs.protobuf.java
}

// QuickBuffers in place of protobuf-java, as WPILib and PhotonVision generate theirs: protoc runs
// QuickBuffers' generator, with descriptors, which WPILib's protobuf logging needs.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protoc.get()}"
    }
    plugins {
        quickbuf {
            artifact = "us.hebi.quickbuf:protoc-gen-quickbuf:${libs.versions.quickbuf.generator.get()}"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                remove java
            }
            task.plugins {
                quickbuf {
                    option "gen_descriptors=true"
                }
            }
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
// The generated messages are QuickBuffers', not ours to cover.
ext.coverageExcludes = [
    "**/protocol/Spotter.class",
    "**/protocol/Spotter\$*"
]
apply from: rootProject.file("gradle/quality.gradle")

// QuickBuffers' javadoc names parameters its methods don't have.
ext.doclint = "all,-missing,-reference"
// Published as com.michaelgrundvig.frc:spotter-protocol (gradle/publishing.gradle).
ext.mavenDescription = "Spotter's protocol, version 2: the messages an FRC robot's manager and its coprocessors' agents exchange (spotter.proto, generated by QuickBuffers), and the pack hash both compute."
apply from: rootProject.file("gradle/publishing.gradle")
