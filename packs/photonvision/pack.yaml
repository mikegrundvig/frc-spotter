# PhotonVision's pack: what the agent checks of PhotonVision, and what it does for it, named and
# fixed here (docs/agent.md, "Packs"). Its helper, bin/photonvision-helper, reads
# PhotonVision's settings database with the robot's own canonicalization (coprocessor-common), on
# the agent's Java runtime; it's this pack's only program.
pack: photonvision
journalUnits: [photonvision.service]
probes:
  # Its service, as systemd sees it: a crashed PhotonVision can't say so itself.
  - id: photonvision.unit
    kind: unit
    unit: photonvision.service
    every: 2
  # Its web server answers: /api/status says "not dead yet" once PhotonVision has started.
  - id: photonvision.http
    kind: http
    url: http://localhost:5800/api/status
    every: 5
  # Its version, read from its jar (the build PhotonLib must match). The pinned build has no page
  # that says it over HTTP, so this reads the jar PhotonVision runs from, on the read-only root.
  - id: photonvision.version
    kind: command
    argv: ['{pack}/bin/photonvision-helper', version, /opt/photonvision/photonvision.jar]
    match: '^(\S+)$'
    every: 60
    watch: [/opt/photonvision/photonvision.jar]
    timeout: 20
  # Its settings' hash, as the robot's build hashes what's committed: equal means as in Git.
  - id: photonvision.settings-hash
    kind: command
    argv: ['{pack}/bin/photonvision-helper', hash, /opt/photonvision/photonvision_config/photon.sqlite]
    match: '^([0-9a-f]{64})$'
    every: 10
    watch: [/opt/photonvision/photonvision_config/photon.sqlite, /opt/photonvision/photonvision_config/photon.sqlite-wal]
    timeout: 20
  # The AprilTag layout it holds, as a fingerprint (LayoutFingerprint): the robot compares it with
  # the layout it uses.
  - id: photonvision.layout
    kind: command
    argv: ['{pack}/bin/photonvision-helper', fingerprint, /opt/photonvision/photonvision_config/photon.sqlite]
    match: '^([0-9a-f]{64})$'
    every: 10
    watch: [/opt/photonvision/photonvision_config/photon.sqlite, /opt/photonvision/photonvision_config/photon.sqlite-wal]
    timeout: 20
  # Each of the computer's cameras, plugged in at the USB port PhotonVision's settings match it by,
  # with its link speed.
  - id: photonvision.camera.{camera}
    each: camera
    kind: command
    argv: ['{pack}/bin/photonvision-helper', camera, /opt/photonvision/photonvision_config/photon.sqlite, '{camera}']
    match: '^present (.*)$'
    every: 10
    timeout: 20
# Stopping PhotonVision first writes its settings: a power cut mid-write could lose them.
beforeShutdown:
  - name: photonvision.stop
    argv: [systemctl, stop, photonvision.service]
    timeout: 120
# Its settings, canonical, for Git: as JSON, and as a zip laid out like the repository's folder.
downloads:
  - name: settings.json
    argv: ['{pack}/bin/photonvision-helper', settings-json, /opt/photonvision/photonvision_config/photon.sqlite]
    contentType: application/json; charset=utf-8
    maxBytes: 33554432
    timeout: 60
  - name: settings.zip
    argv: ['{pack}/bin/photonvision-helper', settings-zip, /opt/photonvision/photonvision_config/photon.sqlite, '{computer}']
    contentType: application/zip
    maxBytes: 67108864
    timeout: 60
