// What the agent and the robot program share: the agent's API records and the JSON they're written
// in, and the probes and packs the agent runs (which a pack's own tests can read too). Plain Java
// with no dependencies, so the agent stays small and the robot program gets nothing it doesn't
// already have; and free of WPILib, which the coprocessors don't run.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, though built with 25: the agent's jar also runs on a board's own Java,
// which may be 17, and a robot program on 25 runs 17's
// unchanged. So nothing past 17: no pattern-matching switches, sequenced collections, or virtual
// threads.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

base {
    archivesName = "spotter-api"
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.jspecify // @Nullable in the records' signatures

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
apply from: rootProject.file("gradle/quality.gradle")
