// What the coprocessors and the robot program share: the coprocessor table, the agent's API records,
// PhotonVision's settings in their canonical form, and the JSON they're written in. Plain Java with
// no dependencies, so the agent stays small and the robot program gets nothing it doesn't already
// have; and free of WPILib, which the coprocessors don't run.

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, though built with 25: the agent's jar also runs on a board's own Java,
// which may be 17 (PhotonVision's 2026 images ship it), and a robot program on 25 runs 17's
// unchanged. So nothing past 17: no pattern-matching switches, sequenced collections, or virtual
// threads.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

base {
    archivesName = "spotter-api"
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.jspecify // @Nullable in the records' signatures

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // PhotonVision's settings database for tests (src/testFixtures): this project's, and the
    // agent's. Settings go in and out of the database through JDBC's own API (java.sql), so only
    // the tests need a driver; the agent brings its own.
    testFixturesRuntimeOnly libs.sqlite.jdbc

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED" // sqlite-jdbc loads its native library
    // Spotter's own packs, which the build tool's tests compile.
    systemProperty "frc.projectDir", rootProject.projectDir.absolutePath
    inputs.files(rootProject.fileTree("packs") { include "*/pack.yaml" })
    .withPropertyName("packs").withPathSensitivity(PathSensitivity.RELATIVE)
}

ext.nullSafePackages = "com.michaelgrundvig.frc.spotter"
apply from: rootProject.file("gradle/quality.gradle")
