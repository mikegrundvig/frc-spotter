pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine with
    // any Java installed.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-spotter"

// What the agent and the robot share: the agent's API records and the JSON they're written in, and
// the probes and packs the agent runs.
include "api"
// The protocol the agent and the robot's manager speak (spotter.proto, generated by QuickBuffers), and
// the code both sides share: the pack hash.
include "protocol"
// The agent each coprocessor runs.
include "agent"
// The robot's side: polling each agent, judging what it says, powering it down, the deploy check.
include "client"
// The container tests: the agent installed from its package in a Java-less Debian 13 container, with
// the robot's client calling it.
include "harness"
