pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine with
    // any Java installed.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-spotter"

// Each project is named as it's published, com.michaelgrundvig.frc:spotter-<name>, and kept in a
// folder of its short name. Gradle matches an included build's projects by group and name, so a
// robot program's includeBuild("../frc-spotter") puts these projects in place of the published
// spotter-manager and spotter-protocol.

// The protocol the agent and the robot's manager speak (spotter.proto, generated by QuickBuffers), and
// the code both sides share: the pack hash.
include "spotter-protocol"
project(":spotter-protocol").projectDir = file("protocol")
// The agent each coprocessor runs.
include "spotter-agent"
project(":spotter-agent").projectDir = file("agent")
// The robot program's manager: each agent's stream, judged, as robot code reads it.
include "spotter-manager"
project(":spotter-manager").projectDir = file("manager")
// The container tests: the agent installed from its package in a Java-less Debian 13 container, with
// a minimal test client playing the robot.
include "spotter-harness"
project(":spotter-harness").projectDir = file("harness")
