pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine with
    // any Java installed.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-spotter"

// Spotter is two programs: the manager, the library a robot program uses, with the protocol inside
// it, this build's one project; and the agent each coprocessor runs, a Rust crate in agent/ that
// cargo builds (the manager's tests run it). The manager is named as it's published,
// com.michaelgrundvig.frc:spotter-manager, in a folder of its short name.
// Gradle matches an included build's projects by group and name, so a robot program's
// includeBuild("../frc-spotter") puts these projects in place of the published ones.

// The robot program's manager, and the protocol both sides speak (spotter.proto, generated by
// QuickBuffers, and the code they share: the pack hash, signing, the wire checks).
include "spotter-manager"
project(":spotter-manager").projectDir = file("manager")
